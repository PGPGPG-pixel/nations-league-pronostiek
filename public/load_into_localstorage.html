<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Load fixtures into localStorage</title></head>
<body>
<h3>Load fixtures into localStorage for app</h3>
<button id="load">Load</button>
<pre id="out"></pre>
<script>
async function load(){
  try{
    const r = await fetch('./fixtures.json', {cache:'no-store'});
    const j = await r.json();
    localStorage.setItem('nl_fixtures', JSON.stringify(j));
    document.getElementById('out').textContent = 'Wrote ' + j.length + ' fixtures to localStorage.nl_fixtures';
  }catch(e){document.getElementById('out').textContent = 'Error: '+e}
}
document.getElementById('load').onclick=load;
</script>
</body>
</html>
